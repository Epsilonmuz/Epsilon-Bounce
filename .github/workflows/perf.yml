name: Performance (Intel + Apple Silicon)

# Times the audio engine against the real-time budget on an Intel Mac (like a 2019 MacBook Pro)
# and on Apple Silicon. Fails if playback costs more than 2 % of a core.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'Source/**', 'Shared/**', 'Tests/**', '.github/workflows/perf.yml' ]

jobs:
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Engine timing
        run: |
          clang++ -std=c++17 -O3 -ISource Tests/EngineTests.cpp -o engine_tests
          ./engine_tests | tee result.txt
          grep PERF result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: "Lag profile (the real plugin: host saves, analysis, audio under automation, drag-out, UI frames)"
        run: |
          git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git JUCE
          cmake -S . -B build-perf -DCMAKE_BUILD_TYPE=Release -DBOUNCE_BUILD_BENCH=ON
          cmake --build build-perf --config Release --target BounceBench -j3
          "$(find build-perf -type f -name BounceBench -perm -u+x | head -1)" | tee bench.txt
          { echo '```'; sed -n '/lag profile/,/grid draws/p' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
